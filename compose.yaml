services:
    redis:
        # Keep the service name and Redis protocol settings for compatibility.
        image: "valkey/valkey:8-alpine"
    hyperglass:
        depends_on:
            - redis
        environment:
            - HYPERGLASS_APP_PATH=/etc/hyperglass
            - HYPERGLASS_HOST=${HYPERGLASS_HOST-0.0.0.0}
            - HYPERGLASS_PORT=${HYPERGLASS_PORT-8001}
            - HYPERGLASS_DEBUG=${HYPERGLASS_DEBUG-false}
            - HYPERGLASS_DEV_MODE=${HYPERGLASS_DEV_MODE-false}
            - HYPERGLASS_REDIS_HOST=${HYPERGLASS_REDIS_HOST-redis}
            - HYPERGLASS_DISABLE_UI=${HYPERGLASS_DISABLE_UI-false}
            - HYPERGLASS_CONTAINER=${HYPERGLASS_CONTAINER-true}
            - HYPERGLASS_ORIGINAL_APP_PATH=${HYPERGLASS_APP_PATH}
        image: ${HYPERGLASS_IMAGE-ghcr.io/hyperglass-community/hyperglass:3.0.0-rc.2}
        ports:
            # Set HYPERGLASS_BIND_ADDRESS=127.0.0.1 for a host reverse proxy.
            # HYPERGLASS_HOST remains 0.0.0.0 inside the container.
            - "${HYPERGLASS_BIND_ADDRESS-0.0.0.0}:${HYPERGLASS_PORT-8001}:${HYPERGLASS_PORT-8001}"
        volumes:
            # The container runs as UID/GID 10001 and builds the UI into this
            # directory, so that user must be able to write to it:
            #   sudo chown -R 10001:10001 /etc/hyperglass
            - ${HYPERGLASS_APP_PATH-/etc/hyperglass}:/etc/hyperglass
        # Health is checked by the image's HEALTHCHECK, which runs
        # `hyperglass healthcheck` (GET /api/health: Redis, configuration state
        # and the built UI) with a start period that covers the first-boot UI build.
