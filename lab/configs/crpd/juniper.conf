system {
    host-name crpd;
    services {
        ssh {
            root-login allow;
        }
    }
}
policy-options {
    /* Keep the full table in the RIB only; the kernel needs just the default routes. */
    policy-statement no-bgp-fib {
        term bgp {
            from protocol bgp;
            then reject;
        }
    }
}
routing-options {
    autonomous-system 65012;
    router-id 10.250.12.1;
    forwarding-table {
        export no-bgp-fib;
    }
}
protocols {
    bgp {
        group core {
            type external;
            peer-as 65000;
            neighbor 10.250.12.0 {
                family inet {
                    unicast {
                        add-path {
                            receive;
                        }
                    }
                }
            }
        }
        group corev6 {
            type external;
            peer-as 65000;
            neighbor fd00:250:12:: {
                family inet6 {
                    unicast {
                        add-path {
                            receive;
                        }
                    }
                }
            }
        }
    }
}
