name: Label pull requests

# pull_request_target runs in the base repository, so it can label pull requests
# from forks. It must never check out or run pull request code: the labeler only
# reads the changed file list from the API and its configuration from the base
# branch.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
