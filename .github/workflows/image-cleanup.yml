name: Image cleanup

# Removes old `sha-<commit>` images that main publishes (#498). It keeps every
# `sha-` image younger than seven days, plus the newest older one, so the image
# of main's current commit survives a quiet week. Images that carry a version
# tag or `latest` are never touched. Once a release promotes the `sha-` image
# of its commit (#499), a released commit keeps its `sha-` tag for good; until
# then a version tag builds a separate image, and the `sha-` image of a released
# commit is not protected. Deleting an image also deletes its attestations,
# which GHCR stores as referrers.
#
# The repository needs the Admin role in the package's "Manage Actions access"
# settings, or the token cannot delete.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove old main images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Remove sha- images older than seven days
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: hyperglass
          use-regex: true
          delete-tags: ^sha-[0-9a-f]{40}$
          # Version tags (3.0.0, 3.0.0-rc.2) and latest protect the whole image.
          # The two version forms are separate alternatives: the action rejects
          # a nested optional group as ReDoS-prone (safe-regex2).
          exclude-tags: ^(latest|[0-9]+\.[0-9]+\.[0-9]+|[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+)$
          older-than: 7 days
          # Among images older than seven days, keep the newest one.
          keep-n-tagged: 1
          # Leftover attestation indexes and untagged manifests whose image is gone.
          delete-orphaned-images: true
          delete-untagged: true
          # First runs list what would be deleted. A follow-up turns this off.
          dry-run: true
