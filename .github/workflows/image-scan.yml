name: Published image scan

# New CVEs are published after an image ships. This rescans the published images
# every week, so a new finding is visible without waiting for the next release.
#
# A scheduled run scans the newest version tag, `latest` once a stable version
# exists, and the newest `sha-<commit>` image that main published, so a finding
# shows up whether or not a stable release exists. Images that share a digest
# are scanned once. A run that cannot find an image it expects fails instead of
# passing without a scan.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to scan. Leave empty to scan the newest version, latest and the newest main image.
        required: false
        default: ""
        type: string

permissions: {}

env:
  # Trivy runs by the index digest of the aquasec/trivy:<TRIVY_VERSION> tag, as in
  # ci.yml, so a replaced tag cannot change what runs. Renovate updates both
  # lines together.
  TRIVY_VERSION: 0.74.0
  TRIVY_DIGEST: sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  resolve:
    name: Find the published images
    # Forks publish no image under their own name, so they would fail every week.
    if: ${{ github.repository == 'hyperglass-community/hyperglass' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Lists the recent commits on main.
      contents: read
    outputs:
      images: ${{ steps.find.outputs.images }}
    steps:
      # Pinned like the image job in ci.yml: the inspect output depends on the
      # buildx version, so do not rely on the runner's copy.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Find the images to scan
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          repo="${IMAGE#ghcr.io/}"

          # Sets $digest to the manifest digest of $IMAGE:$1. Returns 1 when the
          # tag does not exist. Other registry errors are retried, and fail the
          # step on the third attempt.
          lookup() {
            local output attempt
            digest=""
            for attempt in 1 2 3; do
              if output=$(docker buildx imagetools inspect "$IMAGE:$1" --format '{{json .Manifest}}' 2>&1); then
                digest=$(jq -r .digest <<< "$output")
                if [[ "$digest" != sha256:* ]]; then
                  echo "::error::Could not read the digest of $IMAGE:$1."
                  exit 1
                fi
                return 0
              elif grep -q ': not found' <<< "$output"; then
                return 1
              fi
              echo "::warning::Registry error while looking up $IMAGE:$1 ($attempt/3): $output"
              sleep $((attempt * 10))
            done
            echo "::error::The registry failed three times in a row while looking up $IMAGE:$1."
            exit 1
          }

          # curl retries timeouts, refused connections and HTTP 408, 429 and 5xx.
          # It does not retry a 404, which means the package does not exist.
          fetch() {
            curl -fsSL --retry 3 --retry-connrefused --retry-delay 10 "$@"
          }

          # Adds $IMAGE:$1 to the images to scan. Tags that share a digest are
          # scanned once.
          images='[]'
          add() {
            if ! lookup "$1"; then
              echo "::error::$IMAGE:$1 is not published."
              exit 1
            fi
            echo "$IMAGE:$1 is $digest"
            images=$(jq -c --arg tag "$1" --arg digest "$digest" '
              if any(.[]; .digest == $digest)
              then map(if .digest == $digest then .tags += ", " + $tag else . end)
              else . + [{tags: $tag, digest: $digest}]
              end' <<< "$images")
          }

          if [ -n "$TAG" ]; then
            if ! [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "::error::The tag input is not a valid image tag."
              exit 1
            fi
            add "$TAG"
          else
            # The registry's tag list, read anonymously, as Trivy pulls the image.
            token=$(fetch "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -r .token)
            headers="$RUNNER_TEMP/tags-headers.txt"
            url="https://ghcr.io/v2/${repo}/tags/list?n=1000"
            tags=""
            while [ -n "$url" ]; do
              page=$(fetch -D "$headers" -H "Authorization: Bearer $token" "$url")
              tags+=$(jq -r '.tags[]?' <<< "$page")$'\n'
              next=$(tr -d '\r' < "$headers" | sed -n 's/^[Ll]ink: *<\([^>]*\)>; *rel="next".*/\1/p')
              url="${next:+https://ghcr.io$next}"
            done

            # Version tags have the form the promote job in ci.yml publishes,
            # 3.0.0 or 3.0.0-rc.2. A prerelease sorts before its version.
            versions=$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$' <<< "$tags" || true)
            version=$(python3 -c '
          import re, sys
          rank = {"alpha": 0, "beta": 1, "rc": 2}
          def key(v):
              a, b, c, pre, n = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?", v).groups()
              return (int(a), int(b), int(c), (rank[pre], int(n)) if pre else (3, 0))
          versions = sys.stdin.read().split()
          print(max(versions, key=key) if versions else "")
          ' <<< "$versions")
            if [ -z "$version" ]; then
              echo "::error::No version tag is published under $IMAGE."
              exit 1
            fi
            add "$version"

            # `latest` exists once a stable version is released, and must then.
            if grep -qx latest <<< "$tags"; then
              add latest
            elif grep -qv -- '-' <<< "$versions"; then
              echo "::error::A stable version is published, but $IMAGE:latest is not."
              exit 1
            else
              echo "::notice::$IMAGE:latest is not published: no stable version is released yet."
            fi

            # The newest commit on main that has a published image. A commit
            # whose CI run failed or has not finished yet has none; skipping
            # several in a row can mean the publish job is broken.
            commits=""
            for attempt in 1 2 3; do
              if commits=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&per_page=100" \
                --jq '.[] | "\(.sha) \(.commit.committer.date)"'); then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Could not list the commits on main."
                exit 1
              fi
              sleep $((attempt * 10))
            done
            commit=""
            skipped=0
            while read -r sha date; do
              if grep -qx "sha-$sha" <<< "$tags"; then
                commit="$sha"
                break
              fi
              skipped=$((skipped + 1))
            done <<< "$commits"
            if [ -z "$commit" ]; then
              echo "::error::None of the last 100 commits on main has a published sha- image."
              exit 1
            fi
            if [ "$skipped" -gt 0 ]; then
              echo "::notice::The $skipped newest commits on main have no published image. Scanning the image of $commit, committed $date."
            fi
            add "sha-$commit"
          fi

          {
            echo "| Tags | Digest |"
            echo "| --- | --- |"
            jq -r '.[] | "| \(.tags) | `\(.digest)` |"' <<< "$images"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # Trivy pulls each image by digest itself, as the release-image job in ci.yml
  # does, so nothing is pulled on the runner and no Docker socket is mounted.
  scan:
    name: Scan ${{ matrix.image.tags }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.resolve.outputs.images) }}
    steps:
      - name: Scan the published image
        env:
          DIGEST: ${{ matrix.image.digest }}
        run: |
          docker run --rm \
            "aquasec/trivy:${TRIVY_VERSION}@${TRIVY_DIGEST}" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --timeout 20m \
            "$IMAGE@$DIGEST"
