name: CI

# One workflow for pull requests, main and release tags. The `CI gate` job is the
# single status check that branch protection needs to require: it passes only when
# every other job passes, so the required-check list does not change when a matrix
# or a job does.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the superseded run. Runs on main and on
# tags are never cancelled, because both publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.28.11"
  # Trivy runs by the index digest of the aquasec/trivy:<TRIVY_VERSION> tag, so a
  # replaced tag cannot change what runs. Renovate updates both lines together.
  TRIVY_VERSION: 0.74.0
  TRIVY_DIGEST: sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            cache-image: redis:7-alpine
            cache-cli: redis-cli
          - python-version: "3.12"
            cache-image: valkey/valkey:8-alpine
            cache-cli: valkey-cli
    services:
      redis:
        image: ${{ matrix.cache-image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "${{ matrix.cache-cli }} ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HYPERGLASS_HOST: 127.0.0.1
      HYPERGLASS_PORT: 8001
      HYPERGLASS_REDIS_HOST: 127.0.0.1
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements-dev.lock

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Python dependencies
        run: |
          uv venv --python "${{ matrix.python-version }}"
          uv pip install -r requirements-dev.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Prepare application directory
        run: |
          mkdir -p "$HOME/hyperglass"
          echo "HYPERGLASS_APP_PATH=$HOME/hyperglass" >> "$GITHUB_ENV"

      - name: Lint Python
        run: ruff check .

      - name: Test Python
        run: |
          pytest hyperglass --ignore hyperglass/plugins/external \
            --cov=hyperglass --cov-report=xml --cov-report=term

      # Coverage never fails this job. Coveralls compares it with the base branch
      # and sets its own commit status.
      - name: Summarize Python coverage
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          {
            echo "### Backend coverage (Python ${PYTHON_VERSION}): $(coverage report --format=total --precision=1)% of lines"
            echo
            echo "<details><summary>Per-file coverage</summary>"
            echo
            coverage report --format=markdown --precision=1
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Python coverage
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-backend-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

      # One Python version is enough: both run the same tests. coverage.py writes
      # paths relative to hyperglass/, and Coveralls needs them from the root.
      - name: Send Python coverage to Coveralls
        if: ${{ !cancelled() && matrix.python-version == '3.12' && hashFiles('coverage.xml') != '' }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.xml
          format: cobertura
          base-path: hyperglass
          flag-name: backend
          parallel: true
          coverage-reporter-version: v0.6.22
          fail-on-error: false

      - name: Build the UI and start hyperglass
        run: .tests/ga-backend-app.sh

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hyperglass/ui
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      # --frozen-lockfile installs the locked versions and fails when
      # pnpm-lock.yaml does not match package.json.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create empty hyperglass.json
        run: printf '{}\n' > hyperglass.json

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint TypeScript
        run: pnpm run lint

      - name: Check TypeScript types
        run: pnpm run typecheck

      - name: Test TypeScript
        run: pnpm run test:coverage

      # Coverage never fails this job. Coveralls compares it with the base branch
      # and sets its own commit status.
      - name: Summarize TypeScript coverage
        if: ${{ !cancelled() && hashFiles('hyperglass/ui/coverage/coverage-summary.json') != '' }}
        run: |
          {
            echo "### Frontend coverage"
            echo
            echo "| Metric | Covered | Total | % |"
            echo "|---|---:|---:|---:|"
            jq -r '.total | to_entries[]
              | select(.key == "lines" or .key == "statements" or .key == "functions" or .key == "branches")
              | "| \(.key) | \(.value.covered) | \(.value.total) | \(.value.pct) |"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TypeScript coverage
        if: ${{ !cancelled() && hashFiles('hyperglass/ui/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-frontend
          path: |
            hyperglass/ui/coverage/cobertura-coverage.xml
            hyperglass/ui/coverage/coverage-summary.json
          if-no-files-found: error

      # Vitest writes paths relative to hyperglass/ui.
      - name: Send TypeScript coverage to Coveralls
        if: ${{ !cancelled() && hashFiles('hyperglass/ui/coverage/cobertura-coverage.xml') != '' }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: hyperglass/ui/coverage/cobertura-coverage.xml
          format: cobertura
          base-path: hyperglass/ui
          flag-name: frontend
          parallel: true
          coverage-reporter-version: v0.6.22
          fail-on-error: false

  # Closes the Coveralls build once both uploads are in. Coveralls is not part of
  # CI gate: an outage there must not block merges. Its own commit status shows
  # the coverage change.
  coverage:
    name: Coverage
    if: ${{ !cancelled() }}
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Finish the Coveralls build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          parallel-finished: true
          carryforward: backend,frontend
          coverage-reporter-version: v0.6.22
          fail-on-error: false

  package:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build wheel and source distribution
        run: uv build --wheel --sdist

      # pycairo, a dependency of favicons, builds from source and needs the
      # cairo headers.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev

      # Installs the wheel into a clean environment with freshly resolved
      # dependencies, which is what a user gets from `pip install hyperglass`.
      - name: Verify wheel installation
        run: |
          uv venv "$RUNNER_TEMP/wheel-test"
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-test/bin/hyperglass" --help

      - name: Upload Python distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-distributions
          path: dist/*

  image:
    name: Build and scan Docker image
    runs-on: ubuntu-latest
    outputs:
      scan: ${{ steps.scan.outcome }}
      image-id: ${{ steps.export.outputs.image-id }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The checkout is the image build context. Keep the job token out of it.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Only main builds an image to publish: a push to main publishes an
      # immutable `sha-<commit>` tag, and never `latest`. A version tag builds
      # nothing here: the release-image and promote jobs give the tested main
      # image of the tagged commit its version tags. Pull requests build and
      # scan the image only.
      - name: Extract image metadata
        id: meta
        if: ${{ github.ref_type != 'tag' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build image
        if: ${{ github.ref_type != 'tag' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: hyperglass:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fixable HIGH or CRITICAL findings fail the image job and required CI gate.
      - name: Scan image for vulnerabilities
        id: scan
        if: ${{ github.ref_type != 'tag' }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}@${TRIVY_DIGEST}" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --timeout 20m \
            hyperglass:scan

      # The SBOM is generated here, from the image the scan checked, so the
      # publish job runs no third-party container. It ships with the scanned image.
      - name: Generate SBOM
        if: ${{ steps.scan.outcome == 'success' }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP:/out" \
            "aquasec/trivy:${TRIVY_VERSION}@${TRIVY_DIGEST}" image \
            --format spdx-json \
            --output /out/sbom.spdx.json \
            hyperglass:scan

      - name: Report scan result
        if: ${{ failure() && steps.scan.outcome == 'failure' }}
        run: |
          echo "::error title=Image vulnerability scan::The scan failed. See the scan step log. The image cannot pass CI or be published."
          echo "The image vulnerability scan failed. See the scan step log. The image cannot pass CI or be published." >> "$GITHUB_STEP_SUMMARY"

      - name: Export scanned image
        id: export
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.scan.outcome == 'success' }}
        run: |
          echo "image-id=$(docker image inspect --format '{{.Id}}' hyperglass:scan)" >> "$GITHUB_OUTPUT"
          docker save --output "$RUNNER_TEMP/scanned-image.tar" hyperglass:scan

      - name: Upload scanned image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scanned-image
          path: |
            ${{ runner.temp }}/scanned-image.tar
            ${{ runner.temp }}/sbom.spdx.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  ssh:
    name: SSH transport tests
    runs-on: ubuntu-latest
    # A real OpenSSH server for the netmiko and paramiko transport. `frr` maps to
    # netmiko's linux_ssh, so a plain sshd is a representative target.
    services:
      sshd:
        image: lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls238
        env:
          PUID: "1000"
          PGID: "1000"
          PASSWORD_ACCESS: "true"
          USER_NAME: hyperglass
          USER_PASSWORD: hyperglass
          SUDO_ACCESS: "false"
        ports:
          - 2222:2222
    env:
      HYPERGLASS_HOST: 127.0.0.1
      HYPERGLASS_PORT: 8001
      HYPERGLASS_TEST_SSH_HOST: 127.0.0.1
      HYPERGLASS_TEST_SSH_PORT: 2222
      HYPERGLASS_TEST_SSH_USERNAME: hyperglass
      HYPERGLASS_TEST_SSH_PASSWORD: hyperglass
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements-dev.lock

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements-dev.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Settings validation requires an existing application directory.
      - name: Prepare application directory
        run: |
          mkdir -p "$HOME/hyperglass"
          echo "HYPERGLASS_APP_PATH=$HOME/hyperglass" >> "$GITHUB_ENV"

      - name: Wait for the SSH server
        run: |
          for i in $(seq 1 30); do
            if ssh-keyscan -p 2222 -T 3 127.0.0.1 2>/dev/null | grep -q .; then
              echo "sshd is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "sshd did not become reachable in time" >&2
          exit 1

      # The module skips itself without HYPERGLASS_TEST_SSH_HOST, so a skip here
      # means the job is misconfigured, not that the tests passed.
      # `shell: bash` sets pipefail, so a pytest failure is not hidden by tee.
      - name: Test the SSH transport
        shell: bash
        run: |
          pytest hyperglass/execution/drivers/tests/test_ssh_integration.py -v -rs \
            | tee "$RUNNER_TEMP/ssh.log"
          if grep -q SKIPPED "$RUNNER_TEMP/ssh.log"; then
            echo "::error::SSH tests were skipped"
            exit 1
          fi

  gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - backend
      - frontend
      - package
      - image
      - ssh
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done

  publish:
    name: Publish Docker image
    needs:
      - gate
      - image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate.result == 'success' && needs.image.outputs.scan == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Sign attestations with a Sigstore certificate and store them.
      id-token: write
      attestations: write
    steps:
      - name: Download scanned image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: scanned-image
          path: ${{ runner.temp }}

      - name: Verify scanned image
        env:
          EXPECTED_IMAGE_ID: ${{ needs.image.outputs.image-id }}
        run: |
          docker load --input "$RUNNER_TEMP/scanned-image.tar"
          actual_image_id=$(docker image inspect --format '{{.Id}}' hyperglass:scan)
          if [ "$actual_image_id" != "$EXPECTED_IMAGE_ID" ]; then
            echo "::error::Downloaded image does not match the scanned image."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image
        env:
          IMAGE_TAGS: ${{ needs.image.outputs.tags }}
          EXPECTED_IMAGE_ID: ${{ needs.image.outputs.image-id }}
        run: |
          # Defence in depth: main publishes `sha-<commit>` only. Version tags and
          # `latest` come from the promote job.
          if grep -qvE ':sha-[0-9a-f]{40}$' <<< "$IMAGE_TAGS"; then
            echo "::error::Refusing to publish a tag other than sha-<commit> from $GITHUB_REF."
            exit 1
          fi
          while IFS= read -r tag; do
            docker tag "$EXPECTED_IMAGE_ID" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      # Attestations bind to the digest the registry serves for the pushed tags,
      # which is what `gh attestation verify oci://<image>:<tag>` resolves.
      - name: Resolve published digest
        id: digest
        env:
          IMAGE_TAGS: ${{ needs.image.outputs.tags }}
        run: |
          set -euo pipefail
          digest=""
          while IFS= read -r tag; do
            tag_digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [ -z "$digest" ]; then
              digest="$tag_digest"
            elif [ "$tag_digest" != "$digest" ]; then
              echo "::error::$tag resolves to $tag_digest, expected $digest."
              exit 1
            fi
          done <<< "$IMAGE_TAGS"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::Could not resolve the published digest."; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # The SBOM comes from the image job, in the scanned-image artifact.
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

  # A version tag releases the image that main already built, scanned, attested
  # and published as `sha-<commit>`, rather than building a new one. Builds are
  # not reproducible, so a rebuild would release bytes nobody tested (#499).
  # This job has read access only: it checks the tag, finds that image and scans
  # it again against the current vulnerability database.
  release-image:
    name: Scan the main image for release
    needs:
      - gate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.find.outputs.digest }}
    steps:
      - name: Check that the tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `ahead` or `identical`: main contains the tagged commit.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
          case "$status" in
            ahead|identical) ;;
            *)
              echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main (compare status: $status). Tag a commit that main has published."
              exit 1
              ;;
          esac

      # A tag pushed right after a merge can arrive before the main run publishes,
      # so wait for it. No image after that means main never published this
      # commit: it was not the head of a push, or its run failed.
      - name: Find the main image of the tagged commit
        id: find
        run: |
          set -euo pipefail
          ref="$IMAGE:sha-$GITHUB_SHA"
          for attempt in $(seq 1 60); do
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest || true)
            if [[ "$digest" == sha256:* ]]; then
              echo "$ref is $digest"
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for $ref ($attempt/60)"
            sleep 30
          done
          echo "::error::$ref does not exist. Release tags must be on a commit that main published; re-run this job once the main run for $GITHUB_SHA has published."
          exit 1

      # Fixable HIGH or CRITICAL findings block the release, as they do on main.
      # Trivy pulls the public image by digest itself, so no Docker socket is
      # mounted.
      - name: Scan the main image again
        env:
          DIGEST: ${{ steps.find.outputs.digest }}
        run: |
          docker run --rm \
            "aquasec/trivy:${TRIVY_VERSION}@${TRIVY_DIGEST}" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --timeout 20m \
            "$IMAGE@$DIGEST"

  # Adds the version tag, and `latest` for a stable version, to the scanned
  # digest. The image keeps its digest, so the provenance and SBOM attestations
  # from main apply to the version tags as they are.
  promote:
    name: Promote the main image
    needs:
      - gate
      - release-image
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.gate.result == 'success' && needs.release-image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only a stable version moves `latest`: a version with a hyphen, such as
      # v3.0.0-rc.3, is a prerelease. The version tag goes first, so a failed
      # check leaves `latest` untouched. `--prefer-index=false` keeps the single
      # manifest as it is: without it, imagetools wraps the manifest in a new
      # index with a new digest, which the attestations would not cover.
      - name: Tag the main image with the release version
        env:
          DIGEST: ${{ needs.release-image.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          tags=("$IMAGE:$version")
          case "$version" in
            *-*) ;;
            *) tags+=("$IMAGE:latest") ;;
          esac
          for tag in "${tags[@]}"; do
            docker buildx imagetools create --prefer-index=false --tag "$tag" "$IMAGE@$DIGEST"
            actual=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$actual" != "$DIGEST" ]; then
              echo "::error::$tag resolves to $actual, expected $DIGEST."
              exit 1
            fi
            echo "$tag -> $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          done

  release:
    name: Publish GitHub release
    needs:
      - gate
      - package
      - promote
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.gate.result == 'success' && needs.promote.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download Python distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-distributions
          path: dist

      - name: Build release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$version" '
            index($0, "## " ver " ") == 1 || $0 == "## " ver { flag=1; next }
            flag && /^## / { flag=0 }
            flag { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            printf 'hyperglass %s.\n' "$version" > "$notes_file"
          fi
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          case "$VERSION" in
            *-*) release_type=--prerelease ;;
            *) release_type=--latest ;;
          esac
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes-file "$NOTES_FILE" \
            "$release_type" \
            --verify-tag \
            dist/*
